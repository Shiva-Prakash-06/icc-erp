services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: icc_erp
      POSTGRES_USER: icc_erp
      POSTGRES_PASSWORD: local-development-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U icc_erp -d icc_erp"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://icc_erp:local-development-only@db:5432/icc_erp
      SECRET_KEY: local-development-only-change-me
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:8080"
    command: >-
      sh -c "flask --app run:app db upgrade &&
      flask --app run:app bootstrap-reference-data &&
      gunicorn --bind 0.0.0.0:8080 --reload --workers 2 --threads 4 run:app"

volumes:
  postgres-data:
