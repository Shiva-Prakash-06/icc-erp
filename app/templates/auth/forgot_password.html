{% extends "base.html" %}
{% block title %}Forgot your password{% endblock %}
{% block auth_stage_class %} auth-stage--compact{% endblock %}
{% block auth_content %}
<div class="auth-card mx-auto">
  <div class="auth-header"><h1 class="auth-title h3">Forgot your password?</h1></div>
  <p class="text-muted">Type your username or email. If we know it, we will email you a link to set a new password.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="aurora-label" for="identifier">Username or email</label>
    <input class="aurora-input" id="identifier" name="identifier" autocomplete="username" required>
    <button class="aurora-button--primary w-100 mt-3" type="submit">Send reset link</button>
  </form>
</div>
{% endblock %}
