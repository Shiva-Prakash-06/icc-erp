{% extends "base.html" %}

{% block title %}Sign in{% endblock %}

{% block auth_content %}
<div class="auth-card">
    <div class="auth-header">
        <h1 class="auth-title">Sign in</h1>
        <p class="auth-subtitle">Office of International Affairs</p>
    </div>

    <form action="{{ url_for('auth.login') }}" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="aurora-field">
            <label for="username" class="aurora-label">Username or email</label>
            <input type="text" id="username" name="username" class="aurora-input" placeholder="e.g. name@christuniversity.in" required autocomplete="username">
        </div>

        <div class="aurora-field">
            <label for="password" class="aurora-label">Password</label>
            <div class="d-flex gap-2">
                <input type="password" id="password" name="password" class="aurora-input" required autocomplete="current-password">
                <button type="button" class="aurora-button--secondary" data-ui-toggle="password-reveal" data-ui-target="#password" aria-pressed="false">Show</button>
            </div>
        </div>

        <button type="submit" class="aurora-button--primary aurora-button--large w-100 mt-2 blueprint"><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>Sign in</button>
    </form>

    <div class="d-flex justify-content-between mt-3">
        <a href="{{ url_for('auth.forgot_password') }}" class="small">Forgot password</a>
        <a href="{{ url_for('auth.register') }}" class="small">New here? Sign up</a>
    </div>
</div>
{% endblock %}
