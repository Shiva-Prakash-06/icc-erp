{% extends "base.html" %}
{% block title %}Set a new password · ICC/OIA ERP{% endblock %}
{% block auth_content %}
<div class="auth-card mx-auto">
  <div class="auth-header"><h1 class="auth-title h3">Set a new password</h1></div>
  <form method="post" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="form-label-oia" for="new_password">New password</label>
    <input class="form-input-oia" type="password" id="new_password" name="new_password" minlength="12" autocomplete="new-password" required>
    <label class="form-label-oia mt-3" for="confirm_password">Confirm password</label>
    <input class="form-input-oia" type="password" id="confirm_password" name="confirm_password" minlength="12" autocomplete="new-password" required>
    <button class="btn-oia-primary w-100 mt-3" type="submit">Reset password</button>
  </form>
</div>
{% endblock %}
