{% extends "base.html" %}
{% block title %}Set a new password · ICC/OIA ERP{% endblock %}
{% block auth_stage_class %} auth-stage--compact{% endblock %}
{% block auth_content %}
<div class="auth-card mx-auto">
  <div class="auth-header"><h1 class="auth-title h3">Set a new password</h1></div>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="aurora-label" for="new_password">New password</label>
    <div class="d-flex gap-2">
      <input class="aurora-input" type="password" id="new_password" name="new_password" minlength="12" autocomplete="new-password" aria-describedby="recover-password-requirements" required>
      <button type="button" class="aurora-button--outline-info" data-ui-toggle="password-reveal" data-ui-target="#new_password" aria-pressed="false">Show</button>
    </div>
    <p id="recover-password-requirements" class="small text-muted mt-2">At least 12 characters.</p>
    <label class="aurora-label mt-3" for="confirm_password">Confirm password</label>
    <div class="d-flex gap-2">
      <input class="aurora-input" type="password" id="confirm_password" name="confirm_password" minlength="12" autocomplete="new-password" required>
      <button type="button" class="aurora-button--outline-info" data-ui-toggle="password-reveal" data-ui-target="#confirm_password" aria-pressed="false">Show</button>
    </div>
    <button class="aurora-button--primary w-100 mt-3" type="submit">Reset password</button>
  </form>
</div>
{% endblock %}
