{% extends "base.html" %}
{% set hide_sidebar = True %}

{% block title %}Reset Password - OIA Project Intelligence{% endblock %}

{% block auth_content %}
<div class="auth-card mx-auto animate-fade-in">
    <div class="text-warning text-center mb-3">
        <i class="bi bi-shield-lock" style="font-size: 3rem;"></i>
    </div>
    
    <div class="auth-header">
        <h3 class="auth-title">Password Reset Required</h3>
        <p class="auth-subtitle">Security Protocol: Please update your temporary password to continue</p>
    </div>
    
    <form action="{{ url_for('auth.reset_password') }}" method="POST">
        <div class="form-group-oia">
            <label for="new_password" class="form-label-oia">New Secure Password</label>
            <input type="password" id="new_password" name="new_password" class="form-input-oia" placeholder="At least 12 characters" minlength="12" required autocomplete="new-password">
        </div>
        
        <div class="form-group-oia">
            <label for="confirm_password" class="form-label-oia">Confirm New Password</label>
            <input type="password" id="confirm_password" name="confirm_password" class="form-input-oia" placeholder="Confirm password" minlength="12" required autocomplete="new-password">
        </div>
        
        <button type="submit" class="btn-oia-primary w-100 mt-2">Update Password & Access</button>
    </form>
    
    <div class="text-center mt-4">
        <a href="{{ url_for('auth.logout') }}" class="text-danger small fw-bold text-decoration-none">Cancel & Log Out</a>
    </div>
</div>
{% endblock %}
