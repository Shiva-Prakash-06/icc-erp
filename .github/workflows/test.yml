name: production-quality-gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: icc_erp_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/icc_erp_test
      APP_ENV: testing
      TESTING: "true"
      BREACHED_PASSWORD_CHECK_MODE: disabled
      DRIVE_VALIDATION_MODE: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - run: pip install -r requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Validate production infrastructure
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate
      - name: Migration smoke test
        env:
          TESTING: "false"
          APP_ENV: development
        run: |
          flask --app run:app db upgrade
          flask --app run:app db check
      - name: Unit and integration tests with service coverage
        run: coverage run --branch --source=app/services -m pytest -q
      - run: coverage report --fail-under=80
      - name: UI type, build, and raw asset budgets
        run: |
          npm run typecheck
          npm run build:ui
          npm run check:assets
          npm audit --audit-level=high
      - name: Install acceptance browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Full browser acceptance twice on fresh PostgreSQL databases
        env:
          E2E_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/icc_erp_test
          ACCEPTANCE_RESET_POSTGRES: "1"
        run: npm run test:e2e:twice
      - name: Lighthouse quality gates
        run: npm run test:lighthouse
      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-quality-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 14
      - run: pip check
      - run: bandit -q -r app -lll
      - run: pip-audit --local
      - name: Assert no committed environment or database files
        run: test -z "$(git ls-files | grep -E '(^|/)(\.env$|instance/.*\.(db|sqlite)|__pycache__)' || true)"
      - name: Build and inspect Docker-free production artifact
        env:
          SKIP_UI_BUILD: "1"
        run: |
          bash scripts/build-native-release.sh dist/icc-erp-native.tar.gz
          bash scripts/verify-native-release.sh dist/icc-erp-native.tar.gz
      - name: Generate native dependency SBOM
        run: pip-audit --local --format cyclonedx-json --output dist/icc-erp-native-sbom.cdx.json
      - name: Upload release security evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-security-evidence
          path: |
            dist/icc-erp-native.tar.gz
            dist/icc-erp-native.tar.gz.sha256
            dist/icc-erp-native-sbom.cdx.json
          retention-days: 90
